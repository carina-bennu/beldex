name: Beldex Daemon Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Beldex Daemon
    runs-on: ubuntu-22.04

    env:
      CC: gcc-9
      CXX: g++-9

      BOOST_VERSION: 1_83_0
      BOOST_VERSION_DOT: 1.83.0
      BOOST_HASH: 6478edfe2f3305127cffe8caf73ea0176c53769f4bf1585be237eb30798c3b8e

      SODIUM_VERSION: 1.0.18-RELEASE
      SODIUM_HASH: 940ef42797baa0278df6b7fd9e67c7590f87744b

      SQLITE_VERSION: 3310100
      SQLITE_HASH: 62284efebc05a76f909c580ffa5c008a7d22a1287285d68b7825a2b6b51949ae

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ==========================================================
      # 2. INSTALL BUILD DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            software-properties-common \
            ca-certificates \
            build-essential \
            gcc-9 \
            g++-9 \
            gcc-9-plugin-dev \
            cmake \
            curl \
            wget \
            git \
            pkg-config \
            make \
            graphviz \
            doxygen \
            libtool-bin \
            autoconf \
            automake \
            bzip2 \
            xsltproc \
            gperf \
            libsystemd-dev \
            libreadline-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            zlib1g-dev


      # ==========================================================
      # 3. CONFIGURE GCC 9
      # ==========================================================

      - name: Configure GCC 9
        shell: bash
        run: |
          set -euxo pipefail

          sudo update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-9 90

          sudo update-alternatives \
            --install /usr/bin/g++ g++ /usr/bin/g++-9 90

          sudo update-alternatives \
            --install /usr/bin/gcov gcov /usr/bin/gcov-9 90

          gcc --version
          g++ --version
          gcov --version


      # ==========================================================
      # 4. SHOW BUILD ENVIRONMENT
      # ==========================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Operating System"
          echo "======================================"
          cat /etc/os-release

          echo "======================================"
          echo "Compiler"
          echo "======================================"
          ${CC} --version
          ${CXX} --version

          echo "======================================"
          echo "CMake"
          echo "======================================"
          cmake --version

          echo "======================================"
          echo "CPU"
          echo "======================================"
          nproc


      # ==========================================================
      # 5. PREPARE SOURCE DIRECTORY
      # ==========================================================

      - name: Prepare source directory
        shell: bash
        run: |
          set -euxo pipefail

          sudo mkdir -p /usr/local/src
          sudo chown -R "$(id -u):$(id -g)" /usr/local/src


      # ==========================================================
      # 6. BUILD BOOST
      # ==========================================================

      - name: Build Boost
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf "boost_${BOOST_VERSION}"
          rm -f "boost_${BOOST_VERSION}.tar.bz2"

          wget \
            "https://archives.boost.io/release/${BOOST_VERSION_DOT}/source/boost_${BOOST_VERSION}.tar.bz2"

          echo "${BOOST_HASH}  boost_${BOOST_VERSION}.tar.bz2" | sha256sum -c -

          tar -xf "boost_${BOOST_VERSION}.tar.bz2"

          cd "boost_${BOOST_VERSION}"

          ./bootstrap.sh

          sudo ./b2 \
            --prefix=/usr \
            --build-type=minimal \
            link=static \
            runtime-link=static \
            threading=multi \
            threadapi=pthread \
            cxxflags="-fPIC" \
            -j"$(nproc)" \
            --with-atomic \
            --with-chrono \
            --with-date_time \
            --with-filesystem \
            --with-program_options \
            --with-regex \
            --with-serialization \
            --with-system \
            --with-thread \
            --with-locale \
            install

          sudo ldconfig


      # ==========================================================
      # 7. BUILD LIBSODIUM
      # ==========================================================

      - name: Build libsodium
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf libsodium

          git clone \
            --depth 1 \
            --branch "${SODIUM_VERSION}" \
            https://github.com/jedisct1/libsodium.git

          cd libsodium

          test "$(git rev-parse HEAD)" = "${SODIUM_HASH}"

          ./autogen.sh

          cp /usr/share/misc/config.guess build-aux/config.guess
          cp /usr/share/misc/config.sub build-aux/config.sub

          ./configure \
            --prefix=/usr \
            --enable-static \
            --disable-shared \
            --with-pic

          make -j"$(nproc)"

          make check

          sudo make install

          sudo ldconfig


      # ==========================================================
      # 8. BUILD SQLITE
      # ==========================================================

      - name: Build SQLite
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf "sqlite-autoconf-${SQLITE_VERSION}"
          rm -f "sqlite-autoconf-${SQLITE_VERSION}.tar.gz"

          wget \
            "https://www.sqlite.org/2020/sqlite-autoconf-${SQLITE_VERSION}.tar.gz"

          echo "${SQLITE_HASH}  sqlite-autoconf-${SQLITE_VERSION}.tar.gz" | sha256sum -c -

          tar -xf "sqlite-autoconf-${SQLITE_VERSION}.tar.gz"

          cd "sqlite-autoconf-${SQLITE_VERSION}"

          ./configure \
            --prefix=/usr \
            --disable-shared \
            --enable-static \
            --with-pic

          make -j"$(nproc)"

          sudo make install

          sudo ldconfig


      # ==========================================================
      # 9. VERIFY SYSTEM CURL
      # ==========================================================

      - name: Verify system curl
        shell: bash
        run: |
          set -euxo pipefail

          echo "curl version:"
          curl --version

          echo
          echo "libcurl version:"
          pkg-config --modversion libcurl

          echo
          echo "libcurl libraries:"
          pkg-config --libs libcurl

          echo
          echo "libcurl cflags:"
          pkg-config --cflags libcurl


      # ==========================================================
      # 10. REMOVE CONFLICTING LOCAL CURL
      # ==========================================================

      - name: Remove conflicting local curl
        shell: bash
        run: |
          set -euxo pipefail

          # The previous CI workflow installed a static curl into
          # /usr/local/lib/libcurl.a. Remove it so CMake uses
          # Ubuntu's libcurl/OpenSSL configuration.

          sudo rm -f /usr/local/lib/libcurl.a
          sudo rm -f /usr/local/lib/libcurl.so
          sudo rm -f /usr/local/lib/libcurl.so.*
          sudo rm -rf /usr/local/include/curl

          sudo ldconfig

          echo "Checking for local curl:"
          ls -la /usr/local/lib/libcurl* 2>/dev/null || true


      # ==========================================================
      # 11. UPDATE SUBMODULES
      # ==========================================================

      - name: Update git submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive


      # ==========================================================
      # 12. VERIFY IMPORTANT DEPENDENCIES
      # ==========================================================

      - name: Verify dependencies
        shell: bash
        run: |
          set -euxo pipefail

          echo "Boost:"
          ls -l /usr/lib/libboost_*.a | head -20

          echo
          echo "libsodium:"
          pkg-config --modversion libsodium
          pkg-config --libs libsodium

          echo
          echo "SQLite:"
          pkg-config --modversion sqlite3
          pkg-config --libs sqlite3

          echo
          echo "systemd:"
          pkg-config --modversion libsystemd

          echo
          echo "curl:"
          pkg-config --modversion libcurl
          pkg-config --libs libcurl


      # ==========================================================
      # 13. CONFIGURE CMAKE
      # ==========================================================

      - name: Configure CMake
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/release

          mkdir -p build/release

          cd build/release

          echo "Compiler:"
          ${CC} --version
          ${CXX} --version

          cmake \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTATIC=ON \
            -DARCH=x86-64 \
            -DHTTPS_AND_SSL=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_DOCUMENTATION=OFF \
            ../..


      # ==========================================================
      # 14. BUILD BELDEX
      # ==========================================================

      - name: Build Beldex
        shell: bash
        run: |
          set -euxo pipefail

          cd build/release

          make -j"$(nproc)" VERBOSE=1


      # ==========================================================
      # 15. VERIFY BUILD
      # ==========================================================

      - name: Verify Beldex binaries
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Binaries"
          echo "======================================"

          ls -lah build/release/bin/

          echo
          echo "======================================"
          echo "beldexd"
          echo "======================================"

          test -x build/release/bin/beldexd

          file build/release/bin/beldexd

          echo
          echo "Dependencies:"
          ldd build/release/bin/beldexd || true

          echo
          echo "Version:"
          build/release/bin/beldexd --version


      # ==========================================================
      # 16. CREATE CMAKE NATIVE ARCHIVE
      # ==========================================================

      - name: Create release archive
        shell: bash
        run: |
          set -euxo pipefail

          cd build/release

          make create_archive

          echo
          echo "Generated archives:"
          find . -maxdepth 2 \
            -type f \
            \( -name "*.tar.xz" -o -name "*.zip" \) \
            -print


      # ==========================================================
      # 17. PREPARE ARTIFACTS
      # ==========================================================

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf artifacts

          mkdir -p artifacts

          cp -a build/release/bin/. artifacts/

          tar -czf \
            artifacts/beldex-daemon-linux-x86_64.tar.gz \
            -C artifacts .

          echo
          echo "Artifacts:"
          find artifacts -maxdepth 2 -type f -printf '%p\n'

          echo
          echo "Archive:"
          ls -lh artifacts/beldex-daemon-linux-x86_64.tar.gz


      # ==========================================================
      # 18. UPLOAD GITHUB ARTIFACT
      # ==========================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: beldex-daemon-linux-x86_64
          path: |
            artifacts/
            build/release/*.tar.xz
          retention-days: 30


  # ============================================================
  # DEPLOY TO SERVER
  # ============================================================

  deploy:
    name: Deploy Beldex Daemon
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 19. DOWNLOAD BUILD ARTIFACT
      # ==========================================================

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: beldex-daemon-linux-x86_64
          path: artifact


      # ==========================================================
      # 20. CONFIGURE SSH
      # ==========================================================

      - name: Configure SSH
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # ==========================================================
      # 21. UPLOAD BUILD TO SERVER
      # ==========================================================

      - name: Upload Beldex build
        shell: bash
        run: |
          set -euxo pipefail

          FILE="artifact/artifacts/beldex-daemon-linux-x86_64.tar.gz"

          test -f "${FILE}"

          scp \
            -P "${{ secrets.SERVER_PORT }}" \
            "${FILE}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/"


      # ==========================================================
      # 22. VERIFY SERVER FILE
      # ==========================================================

      - name: Verify remote deployment
        shell: bash
        run: |
          set -euxo pipefail

          ssh \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "ls -lh '${{ secrets.DEPLOY_PATH }}/beldex-daemon-linux-x86_64.tar.gz'"
