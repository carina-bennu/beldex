name: Beldex Daemon Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Beldex Daemon
    runs-on: ubuntu-24.04

    env:
      BOOST_VERSION: 1_83_0
      BOOST_VERSION_DOT: 1.83.0
      BOOST_HASH: 6478edfe2f3305127cffe8caf73ea0176c53769f4bf1585be237eb30798c3b8e

      SODIUM_VERSION: 1.0.18-RELEASE
      SODIUM_HASH: 940ef42797baa0278df6b7fd9e67c7590f87744b

      SQLITE_VERSION: 3310100
      SQLITE_HASH: 62284efebc05a76f909c580ffa5c008a7d22a1287285d68b7825a2b6b51949ae

      CURL_VERSION: 7.76.1

      CC: gcc-9
      CXX: g++-9

    steps:

      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # --------------------------------------------------------
      # 2. Show runner information
      # --------------------------------------------------------
      - name: Show environment
        run: |
          set -eux

          echo "Operating system:"
          cat /etc/os-release

          echo
          echo "Compiler:"
          gcc-9 --version
          g++-9 --version

          echo
          echo "CMake:"
          cmake --version

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bash \
            build-essential \
            ca-certificates \
            curl \
            wget \
            git \
            cmake \
            pkg-config \
            make \
            gcc-9 \
            g++-9 \
            graphviz \
            doxygen \
            libtool-bin \
            autoconf \
            automake \
            bzip2 \
            xsltproc \
            gperf \
            libsystemd-dev

          gcc-9 --version
          g++-9 --version

      # --------------------------------------------------------
      # 4. Build Boost 1.83.0
      # --------------------------------------------------------
      - name: Build Boost
        run: |
          set -eux

          sudo mkdir -p /usr/local/src
          sudo chown -R "$USER:$USER" /usr/local/src

          cd /usr/local/src

          curl -L -o boost_${BOOST_VERSION}.tar.bz2 \
            https://archives.boost.io/release/${BOOST_VERSION_DOT}/source/boost_${BOOST_VERSION}.tar.bz2

          echo "${BOOST_HASH}  boost_${BOOST_VERSION}.tar.bz2" \
            | sha256sum -c

          tar -xf boost_${BOOST_VERSION}.tar.bz2

          cd boost_${BOOST_VERSION}

          ./bootstrap.sh

          sudo ./b2 \
            --prefix=/usr \
            --build-type=minimal \
            link=static \
            runtime-link=static \
            --with-atomic \
            --with-chrono \
            --with-date_time \
            --with-filesystem \
            --with-program_options \
            --with-regex \
            --with-serialization \
            --with-system \
            --with-thread \
            --with-locale \
            threading=multi \
            threadapi=pthread \
            cxxflags=-fPIC \
            -j"$(nproc)" \
            install

      # --------------------------------------------------------
      # 5. Build libsodium
      # --------------------------------------------------------
      - name: Build libsodium
        run: |
          set -eux

          cd /usr/local/src

          rm -rf libsodium

          git clone \
            --depth=1 \
            --branch "${SODIUM_VERSION}" \
            https://github.com/jedisct1/libsodium.git \
            libsodium

          cd libsodium

          test "$(git rev-parse HEAD)" = "${SODIUM_HASH}"

          ./autogen.sh

          CONFIG_GUESS=$(find /usr/share -name config.guess | head -n 1)
          CONFIG_SUB=$(find /usr/share -name config.sub | head -n 1)

          cp "${CONFIG_GUESS}" build-aux/config.guess
          cp "${CONFIG_SUB}" build-aux/config.sub

          chmod +x \
            build-aux/config.guess \
            build-aux/config.sub

          ./configure \
            --enable-static \
            --disable-shared \
            --prefix=/usr

          make -j"$(nproc)"

          make check

          sudo make install

      # --------------------------------------------------------
      # 6. Build SQLite
      # --------------------------------------------------------
      - name: Build SQLite
        run: |
          set -eux

          cd /usr/local/src

          curl -L -o sqlite-autoconf-${SQLITE_VERSION}.tar.gz \
            https://sqlite.org/2020/sqlite-autoconf-${SQLITE_VERSION}.tar.gz

          echo "${SQLITE_HASH}  sqlite-autoconf-${SQLITE_VERSION}.tar.gz" \
            | sha256sum -c

          tar -xf sqlite-autoconf-${SQLITE_VERSION}.tar.gz

          cd sqlite-autoconf-${SQLITE_VERSION}

          ./configure \
            --disable-shared \
            --prefix=/usr \
            --with-pic

          make -j"$(nproc)"

          sudo make install

      # --------------------------------------------------------
      # 7. Build curl
      # --------------------------------------------------------
      - name: Build curl
        run: |
          set -eux

          cd /usr/local/src

          curl -L -o curl-${CURL_VERSION}.tar.gz \
            https://curl.se/download/curl-${CURL_VERSION}.tar.gz

          tar -xf curl-${CURL_VERSION}.tar.gz

          cd curl-${CURL_VERSION}

          ./configure \
            --enable-static \
            --disable-shared \
            --prefix=/usr/local

          make -j"$(nproc)"

          sudo make install

          sudo ldconfig

      # --------------------------------------------------------
      # 8. Update submodules
      # --------------------------------------------------------
      - name: Update git submodules
        run: |
          set -eux

          git submodule sync --recursive
          git submodule update --init --recursive

      # --------------------------------------------------------
      # 9. Apply source compatibility fixes
      # --------------------------------------------------------
      - name: Apply source compatibility fixes
        run: |
          set -eux

          sed -i \
            's/add_library(_oxenmq_external_oxenc INTERFACE IMPORTED)//' \
            external/loki-mq/CMakeLists.txt

          sed -i \
            's/target_link_libraries(_oxenmq_external_oxenc INTERFACE oxenc::oxenc)//' \
            external/loki-mq/CMakeLists.txt

          sed -i \
            's/target_link_libraries(oxenmq PUBLIC _oxenmq_external_oxenc)/target_link_libraries(oxenmq PUBLIC oxenc::oxenc)/' \
            external/loki-mq/CMakeLists.txt

          sed -i \
            's/add_subdirectory(Catch2)/if(BUILD_TESTS)\n  add_subdirectory(Catch2)\nendif()/' \
            external/CMakeLists.txt

      # --------------------------------------------------------
      # 10. Configure CMake
      # --------------------------------------------------------
      - name: Configure CMake
        run: |
          set -eux

          rm -rf build/release

          mkdir -p build/release

          cd build/release

          cmake \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DSTATIC=ON \
            -DARCH=x86-64 \
            -DHTTPS_AND_SSL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            ../..

      # --------------------------------------------------------
      # 11. Build Beldex daemon
      # --------------------------------------------------------
      - name: Build Beldex
        run: |
          set -eux

          cd build/release

          make -j"$(nproc)" VERBOSE=1

      # --------------------------------------------------------
      # 12. Verify binary
      # --------------------------------------------------------
      - name: Verify beldexd
        run: |
          set -eux

          echo "Build directory:"
          ls -lah build/release/bin/

          echo
          echo "Binary information:"
          file build/release/bin/beldexd

          echo
          echo "Dynamic dependencies:"
          ldd build/release/bin/beldexd || true

          echo
          echo "Version:"
          build/release/bin/beldexd --version || true

      # --------------------------------------------------------
      # 13. Prepare artifacts
      # --------------------------------------------------------
      - name: Prepare artifacts
        run: |
          set -eux

          rm -rf artifacts

          mkdir -p artifacts

          cp -a build/release/bin/. artifacts/

          tar -czf \
            beldex-daemon-linux-x86_64.tar.gz \
            -C artifacts .

          echo "Artifact:"
          ls -lh beldex-daemon-linux-x86_64.tar.gz

      # --------------------------------------------------------
      # 14. Upload artifact
      # --------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: beldex-daemon-linux-x86_64
          path: |
            beldex-daemon-linux-x86_64.tar.gz
            artifacts/
          retention-days: 30


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Upload binary to server

    needs:
      - build

    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------------
      # 15. Download artifact
      # --------------------------------------------------------
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: beldex-daemon-linux-x86_64
          path: ./artifact

      # --------------------------------------------------------
      # 16. Configure SSH
      # --------------------------------------------------------
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eux

          mkdir -p ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${SERVER_PORT}" \
            "${SERVER_HOST}" \
            >> ~/.ssh/known_hosts

      # --------------------------------------------------------
      # 17. Upload binary
      # --------------------------------------------------------
      - name: Upload binary
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eux

          scp \
            -P "${SERVER_PORT}" \
            ./artifact/beldex-daemon-linux-x86_64.tar.gz \
            "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/"

      # --------------------------------------------------------
      # 18. Verify upload
      # --------------------------------------------------------
      - name: Verify upload
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eux

          ssh \
            -p "${SERVER_PORT}" \
            "${SERVER_USER}@${SERVER_HOST}" \
            "ls -lh ${DEPLOY_PATH}/beldex-daemon-linux-x86_64.tar.gz"

