name: Beldex Daemon Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:


# ==============================================================
# BUILD
# ==============================================================

jobs:

  build:
    name: Build Beldex Daemon
    runs-on: ubuntu-22.04

    env:
      # ----------------------------------------------------------
      # Compiler
      # ----------------------------------------------------------
      CC: gcc-9
      CXX: g++-9

      # ----------------------------------------------------------
      # Boost
      # ----------------------------------------------------------
      BOOST_VERSION: 1_83_0
      BOOST_VERSION_DOT: 1.83.0
      BOOST_HASH: 6478edfe2f3305127cffe8caf73ea0176c53769f4bf1585be237eb30798c3b8e

      # ----------------------------------------------------------
      # libsodium
      # ----------------------------------------------------------
      SODIUM_VERSION: 1.0.18-RELEASE
      SODIUM_HASH: 940ef42797baa0278df6b7fd9e67c7590f87744b

      # ----------------------------------------------------------
      # SQLite
      # ----------------------------------------------------------
      SQLITE_VERSION: 3310100
      SQLITE_HASH: 62284efebc05a76f909c580ffa5c008a7d22a1287285d68b7825a2b6b51949ae

      # ----------------------------------------------------------
      # curl
      # ----------------------------------------------------------
      CURL_VERSION: 7.76.1


    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ==========================================================
      # 2. INSTALL SYSTEM DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            software-properties-common \
            ca-certificates \
            build-essential \
            gcc-9 \
            g++-9 \
            cmake \
            curl \
            wget \
            git \
            pkg-config \
            make \
            graphviz \
            doxygen \
            libtool-bin \
            autoconf \
            automake \
            bzip2 \
            xsltproc \
            gperf \
            libsystemd-dev

          echo
          echo "========================================"
          echo "Compiler packages"
          echo "========================================"

          dpkg -l gcc-9
          dpkg -l g++-9

          echo
          echo "========================================"
          echo "Compiler paths"
          echo "========================================"

          command -v gcc-9
          command -v g++-9

          echo
          echo "========================================"
          echo "GCC 9"
          echo "========================================"

          gcc-9 --version

          echo
          echo "========================================"
          echo "G++ 9"
          echo "========================================"

          g++-9 --version


      # ==========================================================
      # 3. MAKE GCC 9 DEFAULT
      # ==========================================================

      - name: Configure GCC 9
        shell: bash
        run: |
          set -euxo pipefail

          sudo update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-9 90

          sudo update-alternatives \
            --install /usr/bin/g++ g++ /usr/bin/g++-9 90

          sudo update-alternatives \
            --install /usr/bin/gcov gcov /usr/bin/gcov-9 90

          echo
          echo "Active GCC:"
          gcc --version

          echo
          echo "Active G++:"
          g++ --version


      # ==========================================================
      # 4. SHOW BUILD ENVIRONMENT
      # ==========================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Operating System"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "========================================"
          echo "Compiler"
          echo "========================================"

          gcc --version
          g++ --version

          echo
          echo "========================================"
          echo "CMake"
          echo "========================================"

          cmake --version

          echo
          echo "========================================"
          echo "CPU"
          echo "========================================"

          nproc


      # ==========================================================
      # 5. PREPARE SOURCE DIRECTORY
      # ==========================================================

      - name: Prepare source directory
        shell: bash
        run: |
          set -euxo pipefail

          sudo mkdir -p /usr/local/src
          sudo chown -R "$USER:$USER" /usr/local/src

          ls -ld /usr/local/src


      # ==========================================================
      # 6. BUILD BOOST
      # ==========================================================

      - name: Build Boost
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf "boost_${BOOST_VERSION}"
          rm -f "boost_${BOOST_VERSION}.tar.bz2"

          curl -fL \
            -o "boost_${BOOST_VERSION}.tar.bz2" \
            "https://archives.boost.io/release/${BOOST_VERSION_DOT}/source/boost_${BOOST_VERSION}.tar.bz2"

          echo
          echo "Verifying Boost checksum..."

          echo "${BOOST_HASH}  boost_${BOOST_VERSION}.tar.bz2" \
            | sha256sum -c -

          tar -xf "boost_${BOOST_VERSION}.tar.bz2"

          cd "boost_${BOOST_VERSION}"

          ./bootstrap.sh

          sudo ./b2 \
            --prefix=/usr \
            --build-type=minimal \
            link=static \
            runtime-link=static \
            --with-atomic \
            --with-chrono \
            --with-date_time \
            --with-filesystem \
            --with-program_options \
            --with-regex \
            --with-serialization \
            --with-system \
            --with-thread \
            --with-locale \
            threading=multi \
            threadapi=pthread \
            cxxflags=-fPIC \
            -j"$(nproc)" \
            install

          sudo ldconfig


      # ==========================================================
      # 7. BUILD LIBSODIUM
      # ==========================================================

      - name: Build libsodium
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf libsodium

          git clone \
            --depth=1 \
            --branch "${SODIUM_VERSION}" \
            https://github.com/jedisct1/libsodium.git \
            libsodium

          cd libsodium

          echo "Checking libsodium revision..."

          test "$(git rev-parse HEAD)" = "${SODIUM_HASH}"

          echo "libsodium revision verified."

          ./autogen.sh

          CONFIG_GUESS="$(find /usr/share -name config.guess | head -n 1)"
          CONFIG_SUB="$(find /usr/share -name config.sub | head -n 1)"

          test -n "${CONFIG_GUESS}"
          test -n "${CONFIG_SUB}"

          cp "${CONFIG_GUESS}" build-aux/config.guess
          cp "${CONFIG_SUB}" build-aux/config.sub

          chmod +x \
            build-aux/config.guess \
            build-aux/config.sub

          ./configure \
            --enable-static \
            --disable-shared \
            --prefix=/usr

          make -j"$(nproc)"

          make check

          sudo make install

          sudo ldconfig


      # ==========================================================
      # 8. BUILD SQLITE
      # ==========================================================

      - name: Build SQLite
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf "sqlite-autoconf-${SQLITE_VERSION}"
          rm -f "sqlite-autoconf-${SQLITE_VERSION}.tar.gz"

          curl -fL \
            -o "sqlite-autoconf-${SQLITE_VERSION}.tar.gz" \
            "https://sqlite.org/2020/sqlite-autoconf-${SQLITE_VERSION}.tar.gz"

          echo
          echo "Verifying SQLite checksum..."

          echo "${SQLITE_HASH}  sqlite-autoconf-${SQLITE_VERSION}.tar.gz" \
            | sha256sum -c -

          tar -xf "sqlite-autoconf-${SQLITE_VERSION}.tar.gz"

          cd "sqlite-autoconf-${SQLITE_VERSION}"

          ./configure \
            --disable-shared \
            --prefix=/usr \
            --with-pic

          make -j"$(nproc)"

          sudo make install

          sudo ldconfig


      # ==========================================================
      # 9. BUILD CURL
      # ==========================================================

      - name: Build curl
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf "curl-${CURL_VERSION}"
          rm -f "curl-${CURL_VERSION}.tar.gz"

          curl -fL \
            -o "curl-${CURL_VERSION}.tar.gz" \
            "https://curl.se/download/curl-${CURL_VERSION}.tar.gz"

          tar -xf "curl-${CURL_VERSION}.tar.gz"

          cd "curl-${CURL_VERSION}"

          ./configure \
            --enable-static \
            --disable-shared \
            --prefix=/usr/local

          make -j"$(nproc)"

          sudo make install

          sudo ldconfig

          echo
          echo "Installed curl:"
          /usr/local/bin/curl --version


      # ==========================================================
      # 10. UPDATE SUBMODULES
      # ==========================================================

      - name: Update git submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive


      # ==========================================================
      # 11. APPLY SOURCE COMPATIBILITY FIXES
      # ==========================================================

      - name: Apply source compatibility fixes
        shell: bash
        run: |
          set -euxo pipefail

          # loki-mq / oxenc compatibility
          sed -i \
            's/add_library(_oxenmq_external_oxenc INTERFACE IMPORTED)//' \
            external/loki-mq/CMakeLists.txt

          sed -i \
            's/target_link_libraries(_oxenmq_external_oxenc INTERFACE oxenc::oxenc)//' \
            external/loki-mq/CMakeLists.txt

          sed -i \
            's/target_link_libraries(oxenmq PUBLIC _oxenmq_external_oxenc)/target_link_libraries(oxenmq PUBLIC oxenc::oxenc)/' \
            external/loki-mq/CMakeLists.txt

          # Catch2 is not needed when tests are disabled.
          sed -i \
            's/add_subdirectory(Catch2)/if(BUILD_TESTS)\n  add_subdirectory(Catch2)\nendif()/' \
            external/CMakeLists.txt


      # ==========================================================
      # 12. CONFIGURE CMAKE
      # ==========================================================

      - name: Configure CMake
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/release

          mkdir -p build/release

          cd build/release

          echo "C compiler:"
          "${CC}" --version

          echo
          echo "C++ compiler:"
          "${CXX}" --version

          echo
          echo "Configuring CMake..."

          cmake \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DSTATIC=ON \
            -DARCH=x86-64 \
            -DHTTPS_AND_SSL=OFF \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            ../..


      # ==========================================================
      # 13. BUILD BELDEX
      # ==========================================================

      - name: Build Beldex
        shell: bash
        run: |
          set -euxo pipefail

          cd build/release

          make \
            -j"$(nproc)" \
            VERBOSE=1


      # ==========================================================
      # 14. VERIFY BELDEXD
      # ==========================================================

      - name: Verify beldexd
        shell: bash
        run: |
          set -euxo pipefail

          test -f build/release/bin/beldexd

          echo "========================================"
          echo "Beldex binary"
          echo "========================================"

          ls -lh build/release/bin/beldexd

          echo
          echo "========================================"
          echo "File information"
          echo "========================================"

          file build/release/bin/beldexd

          echo
          echo "========================================"
          echo "Dependencies"
          echo "========================================"

          ldd build/release/bin/beldexd || true

          echo
          echo "========================================"
          echo "Version"
          echo "========================================"

          build/release/bin/beldexd --version || true


      # ==========================================================
      # 15. PREPARE ARTIFACT
      # ==========================================================

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf artifacts

          mkdir -p artifacts

          cp -a build/release/bin/. artifacts/

          echo "Artifact contents:"
          ls -lah artifacts/

          tar -czf \
            beldex-daemon-linux-x86_64.tar.gz \
            -C artifacts .

          echo
          echo "Archive:"
          ls -lh beldex-daemon-linux-x86_64.tar.gz


      # ==========================================================
      # 16. UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: beldex-daemon-linux-x86_64
          path: |
            beldex-daemon-linux-x86_64.tar.gz
            artifacts/
          retention-days: 30


  # ==============================================================
  # DEPLOY
  # ==============================================================

  deploy:
    name: Upload binary to server

    needs:
      - build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 17. DOWNLOAD ARTIFACT
      # ==========================================================

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: beldex-daemon-linux-x86_64
          path: ./artifact


      # ==========================================================
      # 18. SHOW ARTIFACT
      # ==========================================================

      - name: Show downloaded artifact
        shell: bash
        run: |
          set -euxo pipefail

          find ./artifact -maxdepth 3 -type f -ls


      # ==========================================================
      # 19. CONFIGURE SSH
      # ==========================================================

      - name: Configure SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euxo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${SERVER_PORT}" \
            "${SERVER_HOST}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # ==========================================================
      # 20. UPLOAD BINARY
      # ==========================================================

      - name: Upload binary
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euxo pipefail

          scp \
            -P "${SERVER_PORT}" \
            ./artifact/beldex-daemon-linux-x86_64.tar.gz \
            "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/"


      # ==========================================================
      # 21. VERIFY UPLOAD
      # ==========================================================

      - name: Verify upload
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euxo pipefail

          ssh \
            -p "${SERVER_PORT}" \
            "${SERVER_USER}@${SERVER_HOST}" \
            "ls -lh ${DEPLOY_PATH}/beldex-daemon-linux-x86_64.tar.gz"

