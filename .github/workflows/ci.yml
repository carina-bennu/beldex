name: Beldex Daemon Build

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

jobs:

  # ============================================================
  # BUILD JOB
  # ============================================================
  build:
    name: Build Beldex Daemon
    runs-on: ubuntu-22.04

    env:
      CC: gcc-9
      CXX: g++-9

      BOOST_VERSION: 1_83_0
      BOOST_VERSION_DOT: 1.83.0
      BOOST_HASH: 6478edfe2f3305127cffe8caf73ea0176c53769f4bf1585be237eb30798c3b8e

      SODIUM_VERSION: 1.0.18-RELEASE
      SODIUM_HASH: 940ef42797baa0278df6b7fd9e67c7590f87744b

      SQLITE_VERSION: 3310100
      SQLITE_HASH: 62284efebc05a76f909c580ffa5c008a7d22a1287285d68b7825a2b6b51949ae

      CURL_VERSION: 7.76.1

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ========================================================
      # INSTALL BUILD DEPENDENCIES
      # ========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            software-properties-common \
            ca-certificates \
            build-essential \
            gcc-9 \
            g++-9 \
            cmake \
            curl \
            wget \
            git \
            pkg-config \
            make \
            graphviz \
            doxygen \
            libtool-bin \
            autoconf \
            automake \
            bzip2 \
            xsltproc \
            gperf \
            libsystemd-dev \
            zlib1g-dev \
            libzstd-dev \
            libbrotli-dev \
            libpsl-dev \
            libssl-dev \
            libboost-all-dev

      # ========================================================
      # CONFIGURE GCC 9
      # ========================================================
      - name: Configure GCC 9
        shell: bash
        run: |
          set -euxo pipefail

          sudo update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-9 90

          sudo update-alternatives \
            --install /usr/bin/g++ g++ /usr/bin/g++-9 90

          sudo update-alternatives \
            --install /usr/bin/gcov gcov /usr/bin/gcov-9 90

          gcc --version
          g++ --version
          gcov --version

      # ========================================================
      # SHOW BUILD ENVIRONMENT
      # ========================================================
      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          cat /etc/os-release

          echo "GCC:"
          gcc --version

          echo "G++:"
          g++ --version

          echo "CMake:"
          cmake --version

          echo "CPU:"
          nproc

      # ========================================================
      # PREPARE SOURCE DIRECTORY
      # ========================================================
      - name: Prepare source directory
        shell: bash
        run: |
          set -euxo pipefail

          sudo mkdir -p /usr/local/src
          sudo chown -R "$USER:$USER" /usr/local/src

          ls -ld /usr/local/src

      # ========================================================
      # BUILD BOOST 1.83
      # ========================================================
      - name: Build Boost 1.83
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf "boost_${BOOST_VERSION}"
          rm -f "boost_${BOOST_VERSION}.tar.bz2"

          curl -fL \
            -o "boost_${BOOST_VERSION}.tar.bz2" \
            "https://archives.boost.io/release/${BOOST_VERSION_DOT}/source/boost_${BOOST_VERSION}.tar.bz2"

          echo "${BOOST_HASH}  boost_${BOOST_VERSION}.tar.bz2" \
            | sha256sum -c -

          tar -xf "boost_${BOOST_VERSION}.tar.bz2"

          cd "boost_${BOOST_VERSION}"

          ./bootstrap.sh

          sudo ./b2 \
            --prefix=/usr \
            --build-type=minimal \
            link=static \
            runtime-link=static \
            --with-atomic \
            --with-chrono \
            --with-date_time \
            --with-filesystem \
            --with-program_options \
            --with-regex \
            --with-serialization \
            --with-system \
            --with-thread \
            --with-locale \
            threading=multi \
            threadapi=pthread \
            cxxflags=-fPIC \
            -j"$(nproc)" \
            install

          sudo ldconfig

      # ========================================================
      # VERIFY BOOST
      # ========================================================
      - name: Verify Boost 1.83
        shell: bash
        run: |
          set -euxo pipefail

          echo "Boost version header:"
          grep -E '#define BOOST_VERSION' \
            /usr/include/boost/version.hpp

          echo
          echo "Boost static libraries:"
          ls -lh /usr/lib/libboost_*.a 2>/dev/null || true

      # ========================================================
      # BUILD LIBSODIUM
      # ========================================================
      - name: Build libsodium
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf libsodium

          git clone \
            --depth=1 \
            --branch "${SODIUM_VERSION}" \
            https://github.com/jedisct1/libsodium.git \
            libsodium

          cd libsodium

          test "$(git rev-parse HEAD)" = "${SODIUM_HASH}"

          ./autogen.sh

          CONFIG_GUESS="$(find /usr/share -name config.guess | head -n 1)"
          CONFIG_SUB="$(find /usr/share -name config.sub | head -n 1)"

          test -n "${CONFIG_GUESS}"
          test -n "${CONFIG_SUB}"

          cp "${CONFIG_GUESS}" build-aux/config.guess
          cp "${CONFIG_SUB}" build-aux/config.sub

          chmod +x \
            build-aux/config.guess \
            build-aux/config.sub

          ./configure \
            --enable-static \
            --disable-shared \
            --prefix=/usr

          make -j"$(nproc)"

          make check

          sudo make install

          sudo ldconfig

      # ========================================================
      # BUILD SQLITE
      # ========================================================
      - name: Build SQLite
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf "sqlite-autoconf-${SQLITE_VERSION}"
          rm -f "sqlite-autoconf-${SQLITE_VERSION}.tar.gz"

          curl -fL \
            -o "sqlite-autoconf-${SQLITE_VERSION}.tar.gz" \
            "https://sqlite.org/2020/sqlite-autoconf-${SQLITE_VERSION}.tar.gz"

          echo "${SQLITE_HASH}  sqlite-autoconf-${SQLITE_VERSION}.tar.gz" \
            | sha256sum -c -

          tar -xf "sqlite-autoconf-${SQLITE_VERSION}.tar.gz"

          cd "sqlite-autoconf-${SQLITE_VERSION}"

          ./configure \
            --disable-shared \
            --prefix=/usr \
            --with-pic

          make -j"$(nproc)"

          sudo make install

          sudo ldconfig

      # ========================================================
      # BUILD CURL 7.76.1
      #
      # HTTPS/SSL is disabled in Beldex, therefore we build
      # curl without SSL, zlib, zstd, brotli and libpsl.
      # This avoids static-link dependency problems.
      # ========================================================
      - name: Build curl
        shell: bash
        run: |
          set -euxo pipefail

          cd /usr/local/src

          rm -rf "curl-${CURL_VERSION}"
          rm -f "curl-${CURL_VERSION}.tar.gz"

          curl -fL \
            -o "curl-${CURL_VERSION}.tar.gz" \
            "https://curl.se/download/curl-${CURL_VERSION}.tar.gz"

          tar -xf "curl-${CURL_VERSION}.tar.gz"

          cd "curl-${CURL_VERSION}"

          ./configure \
            --enable-static \
            --disable-shared \
            --without-ssl \
            --without-zlib \
            --without-zstd \
            --without-brotli \
            --without-libpsl \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-gopher \
            --disable-imap \
            --disable-imaps \
            --disable-pop3 \
            --disable-pop3s \
            --disable-smtp \
            --disable-smtps \
            --disable-telnet \
            --disable-tftp \
            --prefix=/usr/local

          make -j"$(nproc)"

          sudo make install

          sudo ldconfig

          /usr/local/bin/curl --version

          ls -lh /usr/local/lib/libcurl.a
          ls -lh /usr/local/include/curl/curl.h

          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig \
            pkg-config --static --libs libcurl || true

      # ========================================================
      # UPDATE SUBMODULES
      # ========================================================
      - name: Update git submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive

          git submodule update \
            --init \
            --recursive

      # ========================================================
      # APPLY SOURCE COMPATIBILITY FIXES
      # ========================================================
      - name: Apply source compatibility fixes
        shell: bash
        run: |
          set -euxo pipefail

          sed -i \
            's/add_library(_oxenmq_external_oxenc INTERFACE IMPORTED)//' \
            external/loki-mq/CMakeLists.txt

          sed -i \
            's/target_link_libraries(_oxenmq_external_oxenc INTERFACE oxenc::oxenc)//' \
            external/loki-mq/CMakeLists.txt

          sed -i \
            's/target_link_libraries(oxenmq PUBLIC _oxenmq_external_oxenc)/target_link_libraries(oxenmq PUBLIC oxenc::oxenc)/' \
            external/loki-mq/CMakeLists.txt

          sed -i \
            's/add_subdirectory(Catch2)/if(BUILD_TESTS)\n  add_subdirectory(Catch2)\nendif()/' \
            external/CMakeLists.txt

      # ========================================================
      # CHECK CURL
      # ========================================================
      - name: Check curl installation
        shell: bash
        run: |
          set -euxo pipefail

          test -f /usr/local/lib/libcurl.a
          test -d /usr/local/include/curl

          ls -lh /usr/local/lib/libcurl.a
          ls -ld /usr/local/include/curl

          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig \
            pkg-config --modversion libcurl || true

          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig \
            pkg-config --static --libs libcurl || true

      # ========================================================
      # CONFIGURE CMAKE
      #
      # IMPORTANT:
      # Boost_NO_BOOST_CMAKE=ON prevents CMake from using
      # Ubuntu's Boost 1.74 BoostConfig.cmake.
      #
      # This forces CMake to use FindBoost and our Boost 1.83
      # installation.
      # ========================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/release

          mkdir -p build/release

          cd build/release

          echo "========================================"
          echo "Checking Boost installation"
          echo "========================================"

          grep -E '#define BOOST_VERSION' \
            /usr/include/boost/version.hpp

          echo
          echo "Static Boost libraries:"

          ls -lh /usr/lib/libboost_*.a 2>/dev/null || true

          echo
          echo "========================================"
          echo "Checking curl installation"
          echo "========================================"

          test -f /usr/local/lib/libcurl.a
          test -d /usr/local/include/curl

          ls -lh /usr/local/lib/libcurl.a
          ls -ld /usr/local/include/curl

          echo
          echo "========================================"
          echo "Configuring CMake"
          echo "========================================"

          cmake \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTATIC=ON \
            -DARCH=x86-64 \
            -DHTTPS_AND_SSL=OFF \
            -DBUILD_TESTS=OFF \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DBoost_USE_STATIC_LIBS=ON \
            -DBoost_USE_STATIC_RUNTIME=ON \
            -DBOOST_ROOT=/usr \
            -DBoost_NO_SYSTEM_PATHS=OFF \
            -DCMAKE_PREFIX_PATH="/usr/local;/usr" \
            -DCURL_INCLUDE_DIR="/usr/local/include" \
            -DCURL_LIBRARY="/usr/local/lib/libcurl.a" \
            -DCMAKE_LIBRARY_PATH="/usr/local/lib;/usr/lib" \
            ../..

      # ========================================================
      # VERIFY CMAKE DEPENDENCIES
      # ========================================================
      - name: Verify CMake dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd build/release

          echo "========================================"
          echo "Boost configuration"
          echo "========================================"

          grep -Ei 'Boost|boost' CMakeCache.txt || true

          echo
          echo "========================================"
          echo "Curl configuration"
          echo "========================================"

          grep -Ei 'CURL|curl' CMakeCache.txt || true

          echo
          echo "CURL_LIBRARY:"
          grep -E '^CURL_LIBRARY:FILEPATH=' \
            CMakeCache.txt || true

          echo
          echo "CURL_INCLUDE_DIR:"
          grep -E '^CURL_INCLUDE_DIR:PATH=' \
            CMakeCache.txt || true

      # ========================================================
      # BUILD BELDEX
      # ========================================================
      - name: Build Beldex
        shell: bash
        run: |
          set -euxo pipefail

          cd build/release

          make -j"$(nproc)" VERBOSE=1

      # ========================================================
      # VERIFY BELDEXD
      # ========================================================
      - name: Verify beldexd
        shell: bash
        run: |
          set -euxo pipefail

          test -f build/release/bin/beldexd

          echo "========================================"
          echo "beldexd"
          echo "========================================"

          ls -lh build/release/bin/beldexd

          echo
          echo "File information:"
          file build/release/bin/beldexd

          echo
          echo "Dynamic dependencies:"
          ldd build/release/bin/beldexd || true

          echo
          echo "Version:"
          build/release/bin/beldexd --version || true

      # ========================================================
      # PREPARE ARTIFACT
      # ========================================================
      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf artifacts

          mkdir -p artifacts

          cp -a build/release/bin/. artifacts/

          echo "Artifacts:"
          ls -lah artifacts/

          tar -czf \
            beldex-daemon-linux-x86_64.tar.gz \
            -C artifacts .

          echo
          echo "Final archive:"
          ls -lh beldex-daemon-linux-x86_64.tar.gz

      # ========================================================
      # UPLOAD GITHUB ARTIFACT
      # ========================================================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: beldex-daemon-linux-x86_64
          path: |
            beldex-daemon-linux-x86_64.tar.gz
            artifacts/
          retention-days: 30


  # ============================================================
  # DEPLOY JOB
  # ============================================================
  deploy:
    name: Upload binary to server

    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-22.04

    steps:

      # ========================================================
      # DOWNLOAD BUILD ARTIFACT
      # ========================================================
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: beldex-daemon-linux-x86_64
          path: ./artifact

      # ========================================================
      # SHOW DOWNLOADED ARTIFACT
      # ========================================================
      - name: Show downloaded artifact
        shell: bash
        run: |
          set -euxo pipefail

          find ./artifact \
            -maxdepth 3 \
            -type f \
            -ls

      # ========================================================
      # CONFIGURE SSH
      # ========================================================
      - name: Configure SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euxo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' \
            "$SERVER_SSH_KEY" \
            > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${SERVER_PORT}" \
            "${SERVER_HOST}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      # ========================================================
      # UPLOAD BINARY TO SERVER
      # ========================================================
      - name: Upload binary
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euxo pipefail

          scp \
            -P "${SERVER_PORT}" \
            ./artifact/beldex-daemon-linux-x86_64.tar.gz \
            "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/"

      # ========================================================
      # VERIFY UPLOAD
      # ========================================================
      - name: Verify upload
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euxo pipefail

          ssh \
            -p "${SERVER_PORT}" \
            "${SERVER_USER}@${SERVER_HOST}" \
            "ls -lh ${DEPLOY_PATH}/beldex-daemon-linux-x86_64.tar.gz"
